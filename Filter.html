<html>
<head>
	<title>CSS Filter Example</title>
	
	<style>
		img {
			width: 500px;
			height: 400px;
			filter: grayscale(100%);
			transition: 0.5s;
		}
		
		img:hover {
			filter: grayscale(0%) brightness(120%);
		}
	</style>
</head>
<center>
<body>
	<h2>CSS filter property</h2>
	
	<center>
	<img src="image2.png">
</center>
	
</body>
</html>
